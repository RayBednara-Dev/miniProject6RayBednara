{% extends 'base.html' %}

{% block title %}Start Round - Golf Tracker{% endblock %}

{% block content %}
<h1 class="mb-4">Start a New Round</h1>

<form method="post" class="col-md-6">
  {% csrf_token %}
  {% for field in form %}
  <div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.errors %}
    <div class="text-danger small">{{ field.errors }}</div>
    {% endif %}
  </div>
  {% endfor %}
  <button type="submit" class="btn btn-success">Start Round</button>
  <a href="{% url 'home' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
